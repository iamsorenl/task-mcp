[project]
name = "task-mcp"
version = "0.1.0"
description = "Generate lean, task-specific MCP servers from bloated APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "ollama>=0.6.3,<0.7", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4.26,<5"]

[project.scripts]
task-mcp = "task_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["ollama: needs a running Ollama with the default models"]
addopts = "-m 'not ollama'"
