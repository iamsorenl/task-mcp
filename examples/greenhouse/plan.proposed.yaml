api: greenhouse
task: 'Screen job postings for fit against my preferences: scope, day to day, experience
  asked, red flags (seniority, inflated requirements, 996 or long hours, location),
  pay, onsite terms.'
sources: sources.yaml
tools:
- name: search_jobs
  description: Search the job board. Returns short rows. Use get_job for full details.
  endpoint: list_jobs
  params:
    board:
      type: string
      required: true
      description: Board id
    query:
      type: string
      filter: title
      description: Search words in the job title
  fields:
    id: keep
    title: keep
    company_name: keep
    location.name: keep
    metadata[*].value: keep
    updated_at: keep
    requisition_id: keep
    content:
      extract: job_summary
  reasons:
    absolute_url: URL not needed for screening.
    data_compliance: Compliance info irrelevant to job fit.
    internal_job_id: Internal id not used.
    application_deadline: Deadline not relevant to fit.
    language: All postings are in English.
    ai_disclaimer: AI disclaimer not relevant.
    include_ai_disclaimer: Not needed.
    ai_opt_out_request_url: Not needed.
    metadata[*].id: Metadata id not needed.
    metadata[*].name: Metadata name not needed.
    metadata[*].value_type: Metadata type not needed.
    departments[*].id: Department id not needed.
    departments[*].child_ids: Child ids not needed.
    departments[*].parent_id: Parent id not needed.
    offices[*].id: Office id not needed.
    offices[*].child_ids: Child ids not needed.
    offices[*].parent_id: Parent id not needed.
    content: Full content is extracted into job_summary.
- name: get_job
  description: Retrieve full job details for a specific job id.
  endpoint: get_job
  params:
    board:
      type: string
      required: true
    id:
      type: string
      required: true
      description: Job id from search_jobs
  fields:
    id: keep
    title: keep
    company_name: keep
    location.name: keep
    metadata[*].value: keep
    updated_at: keep
    requisition_id: keep
    content:
      extract: job_summary
  reasons:
    absolute_url: URL not needed for screening.
    data_compliance: Compliance info irrelevant to job fit.
    internal_job_id: Internal id not needed.
    application_deadline: Deadline not relevant to fit.
    language: All postings are in English.
    ai_disclaimer: AI disclaimer not relevant.
    include_ai_disclaimer: Not needed.
    ai_opt_out_request_url: Not needed.
    metadata[*].id: Metadata id not needed.
    metadata[*].name: Metadata name not needed.
    metadata[*].value_type: Metadata type not needed.
    departments[*].id: Department id not needed.
    departments[*].child_ids: Child ids not needed.
    departments[*].parent_id: Parent id not needed.
    offices[*].id: Office id not needed.
    offices[*].child_ids: Child ids not needed.
    offices[*].parent_id: Parent id not needed.
    content: Full content is extracted into job_summary.
extracts:
  job_summary:
    html: true
    instructions: 'Summarize the job posting for screening purposes. Extract the following
      structured fields:

      - scope: One sentence describing the overall scope of the role.

      - day_to_day: One sentence describing typical day-to-day responsibilities.

      - experience: Minimum required experience or skill level.

      - red_flags: List of red flags such as seniority mismatch, inflated requirements,
      996/long hours, location issues.

      - pay: Salary range or compensation details.

      - onsite_terms: Whether the role is onsite, remote, or hybrid.

      Only use facts present in the text. Quote any list items that are evidence of
      a red flag or pay range.

      '
    schema:
      scope:
        type: string
        description: Overall scope of the role
      day_to_day:
        type: string
        description: Typical day-to-day responsibilities
      experience:
        type: string
        description: Minimum required experience or skill level
      red_flags:
        type: list
        quote: true
        description: Red flags identified in the posting
      pay:
        type: list
        quote: true
        description: Salary or compensation details
      onsite_terms:
        type: string
        description: Onsite, remote, or hybrid terms
