preferences: 'About me: early-to-mid career software engineer, about 3 years of experience. A role is a fit only if all hold:
  it can be done from a Bay Area office (San Francisco, Peninsula or San Jose; onsite up to 5 days a week is fine); it is
  not Senior, Staff, Principal, lead or manager level; it asks for 4 years of experience or less; it does not expect 996,
  regular extended hours, weekend work or a ''high-intensity'' pace. Remote-only roles are not a fit. Red flag types: seniority
  (senior/staff/lead/manager level), experience_inflation (5+ years asked for a title that isn''t senior, or unusual requirements),
  hours_996 (996, weekends, extended hours, high-intensity), location (no Bay Area office option), pay (no pay range or low
  pay), other.'
red_flag_types:
- seniority
- experience_inflation
- hours_996
- location
- pay
- other
